<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Workspace internal untuk pelaporan dan penanganan kendala IT." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>IT Service Desk</title>
    <script>
      try {
        const saved = localStorage.getItem('service-desk-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = (saved === 'light' || saved === 'dark') ? saved : (prefersDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Aplikasi IT Service Desk membutuhkan JavaScript. Aktifkan JavaScript untuk melanjutkan.</noscript>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
